name: APEX-F1 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-compile:
    name: Test Statistical Engine & Compile Reflex App
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up R Statistical Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify R Statistical Engine & Polars Pipeline
        run: |
          python test_f1_engine.py

      - name: Validate Reflex Application Compilation
        run: |
          python -m reflex compile

      - name: Verify Pre-computed Dataset Integrity
        run: |
          python -c "
          from apex_f1.data_bridge import bridge
          print('Circuits count:', len(bridge.circuits))
          print('Constructors count:', len(bridge.constructors))
          print('Drivers count:', len(bridge.drivers))
          print('Statistical tests:', bridge.get_statistical_tests())
          assert len(bridge.circuits) == 78, 'Expected 78 circuits'
          assert len(bridge.constructors) == 205, 'Expected 205 constructors'
          print('Dataset validation passed.')
          "

